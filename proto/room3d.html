<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이 룸 · 종이 공작 3D 프로토타입</title>
<!--
  다이어터 연금술사 — 마이 룸 «한 장면»을 **종이 공작(페이퍼 크래프트) 디오라마**로
  세우고, 지금 쓰는 아바타·크리처 SVG 를 그대로 «빌보드»로 세워 보는 프로토타입이다.

  ⚠️⚠️ **게임 본편은 한 줄도 안 건드린다.** index.html 은 이 폴더를 안 부르고,
        이 파일도 game.js 를 안 읽는다 — 읽는 것은 data.js·avatar.js·creature.js 셋뿐이다.

  결은 **페이퍼 마리오 + 돈 스타브**다:
    · 모든 것이 «오려 낸 종이»다 — 크림색 재단면 + 손으로 그은 잉크선 + 종이결
    · 세트는 «종이 극장»이다 — 뒷벽 · 옆벽 · 소품 카드가 층으로 서고 3D 가 시차를 준다
    · 빛은 창에서 한 줄기, 어둠은 가장자리에서 (비네트) · 공기는 먼지가 만든다

  여는 법 — npm start 뒤에 http://localhost:8080/proto/room3d.html
-->
<style>
  :root{
    --ink:#4a3a44; --ink-soft:#6e5d69; --card:#fffdfa; --line:rgba(90,70,85,0.14);
    --pink-2:#f2a3bd; --on-accent:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#120f18;color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;display:block}
  #stage.drag{cursor:grabbing}
  /* 비네트 — 후처리 없이 CSS 한 겹으로. 돈 스타브의 «가장자리 어둠»이 이 한 줄이다 */
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 72% 62% at 50% 44%,rgba(0,0,0,0) 34%,rgba(20,10,24,.30) 62%,rgba(14,6,18,.62) 84%,rgba(8,3,12,.86) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:multiply;
    image-rendering:pixelated}
  #panel{position:fixed;left:12px;top:12px;width:252px;max-width:calc(100vw - 24px);
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
    box-shadow:0 10px 30px rgba(20,12,26,.4);font-size:13px;line-height:1.5;
    max-height:calc(100vh - 24px);overflow:auto}
  #panel h1{font-size:14px;margin:0 0 2px}
  #panel p{margin:0 0 10px;color:var(--ink-soft);font-size:11.5px;line-height:1.45}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0}
  .row label{flex:0 0 58px;color:var(--ink-soft);font-size:11.5px}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--pink-2)}
  .row output{flex:0 0 34px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  button{border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;
    background:#efe7ee;color:var(--ink);cursor:pointer}
  button.on{background:var(--pink-2);color:var(--on-accent)}
  #fps{position:fixed;right:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;
    padding:5px 10px;border-radius:999px;font-size:11px;font-variant-numeric:tabular-nums}
  #err{position:fixed;inset:auto 12px 12px 12px;background:#fff;border-radius:14px;padding:14px;
    font-size:13px;display:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="grain"></canvas>
<div id="vig"></div>
<div id="fps">—</div>
<div id="panel">
  <h1>마이 룸 · 종이 공작 3D</h1>
  <p>세트는 <b>오려 낸 종이</b>, 인물·크리처는 <b>지금 쓰는 SVG 그대로</b>입니다.
     끌어서 돌리고 휠로 당깁니다.</p>
  <div class="row"><label>몸무게</label>
    <input id="w" type="range" min="0" max="100" value="55"><output id="wv">0.55</output></div>
  <div class="row"><label>바디파츠</label>
    <input id="t" type="range" min="50" max="150" value="100"><output id="tv">100%</output></div>
  <div class="btns">
    <button id="bNight">🌙 밤</button>
    <button id="bSpin" class="on">🔄 자동 회전</button>
    <button id="bFlat">📐 펼쳐 보기</button>
    <button id="bCloth">👗 옷 바꾸기</button>
    <button id="bPet">🦋 크리처 바꾸기</button>
  </div>
  <p id="note" style="margin-top:10px"></p>
</div>
<div id="err"></div>

<script>
// ⚠️⚠️ **게임 파일은 «열 때마다» 새로 받는다.** 서버는 정적 파일에 1년짜리 캐시를
//    주고(server/index.js), 본편은 index.html 의 ?v= 로 그것을 넘긴다 —
//    여기서 그냥 <script src="../avatar.js"> 로 두면 **그림을 고쳐도 옛 파일이
//    계속 온다.** 프로토타입에 캐시 버스터를 «또» 적어 두면 본편과 어긋나므로
//    (사본이 하나 더 생긴다) 여기서는 시각을 붙여 캐시를 아예 안 쓴다
window.__deps = (async () => {
  const q = '?t=' + Date.now();
  for (const f of ['../data.js', '../avatar.js', '../creature.js']) {
    await new Promise((ok, no) => {
      const el = document.createElement('script');
      el.src = f + q; el.onload = ok; el.onerror = () => no(new Error(f));
      document.head.appendChild(el);
    });
  }
})();
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
await window.__deps;          // 위의 세 파일이 다 온 뒤에 시작한다

const errBox = document.getElementById('err');
const fatal = (m) => { errBox.style.display = 'block'; errBox.textContent = '⚠ ' + m; };
if (!window.Avatar || !window.GameData || !window.Creature)
  fatal('data.js / avatar.js / creature.js 를 못 읽었다.');

// ══ 종이와 잉크 ═══════════════════════════════════════════════
//
// ⚠️⚠️ **이 한 덩어리가 이 프로토타입의 «그림»을 다 만든다.** 3D 쪽은 종이 카드를
//    세우는 일만 하고, 보이는 것은 전부 여기서 캔버스에 그린다 — 그래서
//    「더 예쁘게」는 three.js 가 아니라 여기를 고치는 일이다.

const PAL = {
  ink:  '#2f2230',           // 잉크 — «먹»색이다. 새까만 선은 인쇄물로 보인다
  cut:  '#f7f0e2',           // 재단면 — 오려 낸 종이의 «흰 테». 이것이 곧 종이의 증거다
  wall: ['#d9c7a6', '#b9a184'],
  wood: ['#9a6b45', '#6f4a2e'],
  woodL:['#c08d5e', '#8a5f3c'],
  cloth:['#c86a86', '#a04f6a'],
  leaf: ['#7fa86a', '#55794a'],
  brew: '#8ee6c8',
  dark: '#3c3540',
};

// 결정적인 잡음 — 손그림의 «떨림»을 만든다. 매번 다르면 프레임마다 지글거린다
function rnd(seed) { let t = (seed * 16807) % 2147483647 || 7; return () => (t = t * 16807 % 2147483647) / 2147483647; }

// ⚠️⚠️ **선 굵기는 «픽셀»이 아니라 «세상의 길이»로 정해야 한다.**
//    카드마다 텍스처 해상도가 달라서(벽 1024px/9.6칸 · 책장 640px/2.6칸) 같은 숫자 5 가
//    화면에서 두 배 넘게 차이 났다 — 책장 선만 가늘어 종이가 아니라 «사진»으로 보인다.
//    그리기 직전에 칸당 픽셀(PPU)을 넣어 두고, 그 값으로 환산해서 긋는다.
const INK_REF = 100;                     // 기준 — 숫자 6 은 「세상에서 0.06칸 굵기」라는 뜻이다
let PPU = INK_REF;                       // 지금 그리는 텍스처의 «칸당 픽셀»
const ink2px = (n) => n * PPU / INK_REF;

// ── 손으로 그은 잉크선 ────────────────────────────────────────
// ⚠️⚠️ **굵기가 변해야 «그은 선»이다.** 같은 굵기로 stroke 하면 벡터 클립아트가 된다 —
//    양 끝이 가늘고 가운데가 굵은 «붓»을 다각형으로 직접 만든다
function inkStroke(g, pts, opt) {
  const o = Object.assign({ w: 7, close: false, jitter: 1.6, seed: 7, color: PAL.ink }, opt);
  o.w = ink2px(o.w);
  const r = rnd(o.seed);
  const p = pts.map(([x, y], i) => {
    const k = i / (pts.length - 1 || 1);
    return [x + (r() - 0.5) * o.jitter, y + (r() - 0.5) * o.jitter, k];
  });
  if (o.close) p.push([p[0][0], p[0][1], 1]);
  const L = [], R = [];
  for (let i = 0; i < p.length; i++) {
    const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    // 양 끝이 가늘어지는 붓 — 닫힌 선은 고르게 둔다
    const t = o.close ? 1 : Math.sin(Math.PI * p[i][2]) * 0.75 + 0.35;
    const w = o.w * t * 0.5;
    L.push([p[i][0] - dy * w, p[i][1] + dx * w]);
    R.push([p[i][0] + dy * w, p[i][1] - dx * w]);
  }
  g.beginPath();
  L.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  for (let i = R.length - 1; i >= 0; i--) g.lineTo(R[i][0], R[i][1]);
  g.closePath(); g.fillStyle = o.color; g.fill();
}

// ── 종이 카드 한 장 ──────────────────────────────────────────
// 오려 낸 종이 = **재단면(크림 테) → 칠 → 잉크선** 순서다.
// ⚠️ 잉크선을 «먼저» 그으면 재단면이 그 위를 덮어 테만 남는다
function bbox(pts) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
}
function paperShape(g, pts, fill, opt) {
  const o = Object.assign({ cut: 9, ink: 6, seed: 3, shade: null }, opt);
  const path = () => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
  if (o.cut) {   // 재단면 — 굵게 한 번 긋고 그 위를 칠이 덮는다
    path(); g.lineJoin = 'round'; g.lineCap = 'round';
    g.strokeStyle = PAL.cut; g.lineWidth = ink2px(o.cut) * 2; g.stroke();
  }
  path(); g.fillStyle = fill; g.fill();
  if (o.shade) {   // 아래쪽 그늘 — 종이가 «면»으로 읽힌다
    g.save(); path(); g.clip();
    const b = bbox(pts);
    const lg = g.createLinearGradient(0, b.y0, 0, b.y1);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(1, o.shade);
    g.fillStyle = lg; g.fillRect(b.x0 - 4, b.y0 - 4, b.x1 - b.x0 + 8, b.y1 - b.y0 + 8);
    g.restore();
  }
  if (o.ink) inkStroke(g, pts, { w: o.ink, close: true, seed: o.seed, jitter: 1.4 });
}
function rect(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
// 모서리가 살짝 둥근 네모 — 가위로 오린 종이는 각이 날카롭지 않다
function roundRect(x, y, w, h, r) {
  const p = [];
  const arc = (cx, cy, a0, a1) => {
    for (let i = 0; i <= 4; i++) { const a = a0 + (a1 - a0) * i / 4; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  };
  arc(x + w - r, y + r, -Math.PI / 2, 0); arc(x + w - r, y + h - r, 0, Math.PI / 2);
  arc(x + r, y + h - r, Math.PI / 2, Math.PI); arc(x + r, y + r, Math.PI, Math.PI * 1.5);
  return p;
}
function blob(cx, cy, rx, ry, n, seed) {
  const r = rnd(seed), p = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, k = 1 + (r() - 0.5) * 0.09;
    p.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return p;
}
// 종이결 — 아주 옅은 잡티. 없으면 «플라스틱»으로 보인다
function grainOver(g, w, h, seed, amt) {
  const r = rnd(seed);
  g.save(); g.globalAlpha = amt || 0.05;
  for (let i = 0; i < w * h / 110; i++) {
    g.fillStyle = r() < 0.5 ? '#000' : '#fff';
    g.fillRect(r() * w, r() * h, 1 + r() * 1.5, 1 + r() * 1.5);
  }
  g.restore();
}
function tex(w, h, draw, opt) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  // ⚠️ 이 카드가 세상에서 몇 칸인지(`units`)를 주면 선 굵기가 저절로 맞는다.
  //    안 주면 기준값이라 옛날처럼 «픽셀»로 긋는다
  // ⚠️⚠️ **한계를 안 씌우면 «작은 카드»가 통째로 잉크가 된다.** 굵기를 세상의 길이로
  //    못 박으면 0.86칸짜리 촛대에서 그 선이 카드 폭의 7% 라 등잔이 «덩어리»로 보였다
  //    (그려 보고 알았다). 화면에서 3~4px 이 되는 띠로 자른다
  PPU = (opt && opt.units) ? Math.max(70, Math.min(150, w / opt.units)) : INK_REF;
  draw(c.getContext('2d'), w, h);
  PPU = INK_REF;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (opt && opt.rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opt.rep[0], opt.rep[1]); }
  return t;
}

// ══ 장면 ══════════════════════════════════════════════════════
const canvas = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { fatal('WebGL 을 못 켰다: ' + e.message); }
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1b1520');
scene.fog = new THREE.Fog('#241b26', 15, 28);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

// ── 셀 셰이딩 ─────────────────────────────────────────────────
// ⚠️ **칠은 이미 종이에 그려져 있다.** 여기서 빛까지 세게 끊으면 그림이 탁해진다 —
//    «부드러운» 세 칸 램프로 두어 낮/밤만 읽히게 한다
function ramp(steps) {
  const t = new THREE.DataTexture(new Uint8Array(steps), steps.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
}
const RAMP = ramp([172, 226, 255]);
const toon = (o) => new THREE.MeshToonMaterial(Object.assign({ gradientMap: RAMP }, o));

const key = new THREE.DirectionalLight(0xfff0d8, 1.5);
key.position.set(5.5, 6.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -7; key.shadow.camera.right = 7;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -2;
key.shadow.bias = -0.002;
scene.add(key);
const amb = new THREE.AmbientLight(0xffe6d2, 1.05);
scene.add(amb);
const moon = new THREE.PointLight(0xa9c6ff, 0, 12);
moon.position.set(3.4, 3.6, -2.6);
scene.add(moon);

// ── 종이 카드를 «세운다» ──────────────────────────────────────
//
// ⚠️⚠️ **평평한 판으로 두면 «스티커»다.** 진짜 종이는 아주 살짝 휜다 —
//    판을 여러 칸으로 나누고 z 를 사인으로 밀어 **부드러운 말림**을 준다.
//    그 한 줄이 「3D 안에 종이가 서 있다」를 만든다
const cards = [];
function paperCard(texture, w, h, opt) {
  const o = Object.assign({ curl: 0.05, seg: 14 }, opt);
  const geo = new THREE.PlaneGeometry(w, h, o.seg, 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) / (w / 2);                  // -1 ~ 1
    pos.setZ(i, -Math.cos(x * Math.PI / 2) * o.curl * w);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, toon({ map: texture, transparent: true, alphaTest: 0.45,
    side: THREE.DoubleSide }));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
// 접지 그림자 — **바닥에 닿는 자국이 없으면 종이가 공중에 뜬다**
const shadowTex = tex(128, 128, (g, w, h) => {
  const rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  rg.addColorStop(0, 'rgba(30,16,34,0.5)');
  rg.addColorStop(0.5, 'rgba(30,16,34,0.22)');
  rg.addColorStop(1, 'rgba(30,16,34,0)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
});
function stand(mesh, x, y, z, opt) {
  const o = Object.assign({ yaw: 0, shadow: 1 }, opt);
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = o.yaw;
  mesh.position.y = y;
  g.add(mesh);
  if (o.shadow) {
    const b = new THREE.Box3().setFromObject(mesh);
    const sw = (b.max.x - b.min.x) * 1.2 * o.shadow;
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(sw, sw * 0.42),
      new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2; sh.position.set(0, 0.02, 0.08);
    g.add(sh);
  }
  scene.add(g);
  g.userData.z0 = z; g.userData.x0 = x;
  cards.push(g);
  return g;
}

// ══ 세트 — 종이 극장 ═══════════════════════════════════════════
const ROOM_W = 9.6, ROOM_D = 8.4, WALL_H = 6.4;

// ── 바닥 ──────────────────────────────────────────────────────
// 널빤지마다 «잉크 이음새»와 결이 있다. 한 색 판은 바닥이 아니라 색종이다
const floorTex = tex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#a9754c'; g.fillRect(0, 0, w, h);
  const r = rnd(11);
  for (let i = 0; i < 8; i++) {
    const y = i * h / 8;
    g.fillStyle = ['#b07c52', '#a4714a', '#ab7750', '#9d6b45'][i % 4];
    g.fillRect(0, y, w, h / 8);
    g.save(); g.globalAlpha = 0.15;
    for (let k = 0; k < 6; k++) {
      const yy = y + 10 + r() * (h / 8 - 20);
      inkStroke(g, [[0, yy], [w * 0.4, yy + (r() - 0.5) * 8], [w, yy + (r() - 0.5) * 10]],
        { w: 2.4, seed: i * 9 + k + 1, jitter: 3, color: '#5e3a20' });
    }
    g.restore();
    inkStroke(g, [[0, y], [w * 0.5, y + 1.5], [w, y]], { w: 4, seed: i + 3, jitter: 2, color: '#4d2e19' });
    const off = (i % 2) ? w * 0.42 : w * 0.08;
    [off, off + w * 0.5].forEach((x, j) => {
      inkStroke(g, [[x, y + 2], [x + 1.5, y + h / 16], [x, y + h / 8 - 2]],
        { w: 3, seed: i * 5 + j + 2, jitter: 1.4, color: '#4d2e19' });
    });
  }
  grainOver(g, w, h, 5, 0.07);
}, { units: ROOM_W + 5 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W + 5, ROOM_D + 5), toon({ map: floorTex }));

// ── 벽 — 종이 극장의 «판» 셋 ──────────────────────────────────
function wallTex(seed) {
  return tex(1024, 680, (g, w, h) => {
    const lg = g.createLinearGradient(0, 0, 0, h);
    lg.addColorStop(0, PAL.wall[0]); lg.addColorStop(1, PAL.wall[1]);
    g.fillStyle = lg; g.fillRect(0, 0, w, h);
    g.save(); g.globalAlpha = 0.06;                      // 벽지 세로 줄
    for (let x = 0; x < w; x += 46) { g.fillStyle = '#fff'; g.fillRect(x, 0, 16, h); }
    g.restore();
    const r = rnd(seed);
    for (let i = 1; i < 5; i++) {                        // 돌 이음새 (손으로 그은 것)
      const y = i * h / 5;
      inkStroke(g, [[0, y], [w * 0.33, y + (r() - 0.5) * 6], [w * 0.66, y + (r() - 0.5) * 6], [w, y]],
        { w: 3.4, seed: seed * 3 + i, jitter: 2.4, color: 'rgba(62,44,34,0.40)' });
      const off = (i % 2) ? w / 6 : 0;
      for (let k = 0; k < 3; k++) {
        const x = off + k * w / 3;
        if (x < 8 || x > w - 8) continue;
        inkStroke(g, [[x, y], [x + (r() - 0.5) * 4, y + h / 10], [x, y + h / 5]],
          { w: 3, seed: seed * 7 + i * 4 + k, jitter: 2, color: 'rgba(62,44,34,0.32)' });
      }
    }
    paperShape(g, rect(-10, h - 70, w + 20, 84), '#8d6a49', { cut: 0, ink: 5, seed: seed + 2 });
    paperShape(g, rect(-10, -14, w + 20, 44), '#8d6a49', { cut: 0, ink: 5, seed: seed + 5 });
    // 천장 쪽 그늘 — 위가 어두워야 방이 «상자»로 읽힌다 (돈 스타브의 그 어둠이다)
    const tg = g.createLinearGradient(0, 0, 0, h * 0.62);
    tg.addColorStop(0, 'rgba(38,22,36,0.46)'); tg.addColorStop(1, 'rgba(38,22,36,0)');
    g.fillStyle = tg; g.fillRect(0, 0, w, h * 0.62);
    grainOver(g, w, h, seed, 0.05);
  }, { units: ROOM_W });
}

// ── 창 — 뒷벽에 «붙인» 카드 ───────────────────────────────────
function windowTex(night) {
  return tex(512, 700, (g, w, h) => {
    const sky = g.createLinearGradient(0, 40, 0, h - 40);
    if (night) { sky.addColorStop(0, '#2b2c5c'); sky.addColorStop(1, '#4e4e86'); }
    else { sky.addColorStop(0, '#8ed3f6'); sky.addColorStop(1, '#dff0fb'); }
    g.fillStyle = sky; g.fillRect(28, 40, w - 56, h - 100);
    if (night) {
      g.fillStyle = '#f9f2cc'; g.beginPath(); g.arc(w * 0.66, 170, 46, 0, 7); g.fill();
      g.fillStyle = '#3a3a72'; g.beginPath(); g.arc(w * 0.56, 148, 44, 0, 7); g.fill();
      const r = rnd(4); g.fillStyle = '#fff';
      for (let i = 0; i < 16; i++) { g.beginPath(); g.arc(40 + r() * (w - 80), 60 + r() * (h - 220), 1.6 + r() * 1.4, 0, 7); g.fill(); }
    } else {
      g.fillStyle = '#ffe9a6'; g.beginPath(); g.arc(w * 0.66, 180, 52, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.beginPath(); g.ellipse(w * 0.34, 300, 74, 26, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(w * 0.70, 420, 56, 20, 0, 0, 7); g.fill();
    }
    g.fillStyle = night ? '#3c4a6b' : '#9ec48a';        // 먼 언덕
    g.beginPath(); g.moveTo(28, h - 130);
    g.quadraticCurveTo(w * 0.35, h - 250, w * 0.62, h - 140);
    g.quadraticCurveTo(w * 0.82, h - 196, w - 28, h - 120);
    g.lineTo(w - 28, h - 56); g.lineTo(28, h - 56); g.fill();
    g.save(); g.globalAlpha = 0.2; g.fillStyle = '#fff';  // 유리 반사 — 사선 둘
    g.beginPath(); g.moveTo(60, h - 90); g.lineTo(190, 60); g.lineTo(240, 60); g.lineTo(110, h - 90); g.fill();
    g.beginPath(); g.moveTo(250, h - 90); g.lineTo(330, 60); g.lineTo(356, 60); g.lineTo(276, h - 90); g.fill();
    g.restore();
    const fr = '#7a4f30';                                 // 창틀 — 오려 붙인 종이
    paperShape(g, rect(0, 0, w, 46), fr, { cut: 7, ink: 5, seed: 21 });
    paperShape(g, rect(0, h - 58, w, 58), fr, { cut: 7, ink: 5, seed: 22 });
    paperShape(g, rect(0, 0, 38, h), fr, { cut: 7, ink: 5, seed: 23 });
    paperShape(g, rect(w - 38, 0, 38, h), fr, { cut: 7, ink: 5, seed: 24 });
    paperShape(g, rect(w / 2 - 14, 32, 28, h - 84), fr, { cut: 4, ink: 4, seed: 25 });
    paperShape(g, rect(22, h * 0.46, w - 44, 26), fr, { cut: 5, ink: 5, seed: 26 });
  }, { units: 2.5 });
}

function sconceTex() {

    g.clearRect(0, 0, w, h);

      { cut: 6, ink: 5, seed: 90, shade: 'rgba(40,20,8,0.4)' });

    paperShape(g, [[104, 258], [152, 258], [160, 236], [96, 236]], '#a07a4c',   // 팔
      { cut: 5, ink: 5, seed: 91 });
    paperShape(g, [[72, 236], [184, 236], [170, 212], [86, 212]], '#c39a62',   // 접시
      { cut: 6, ink: 5, seed: 92, shade: 'rgba(60,34,14,0.3)' });
    paperShape(g, roundRect(100, 96, 56, 120, 10), '#f6eddc',                  // 초
      { cut: 6, ink: 5, seed: 93, shade: 'rgba(120,96,60,0.34)' });
    paperShape(g, [[100, 128], [92, 166], [101, 186], [110, 158], [110, 128]], '#fbf5e8',  // 촛농
      { cut: 0, ink: 3, seed: 94 });
    inkStroke(g, [[128, 96], [128, 80]], { w: 3, seed: 98, jitter: 0.6, color: PAL.ink }); // 심지
    paperShape(g, [[128, 14], [152, 58], [148, 84], [128, 96], [108, 84], [104, 58]],      // 불꽃
      '#ffc94a', { cut: 0, ink: 4, seed: 95 });
    paperShape(g, [[128, 42], [142, 70], [128, 88], [114, 70]], '#fff6cc', { cut: 0, ink: 0, seed: 96 });
  }, { units: 0.86 });
}

//    옆벽에 90° 로 세우는 순간 카메라에서 두께 0 이 된다 — 처음에 그렇게 두었다가

// ── 벽과 바닥이 만나는 자리의 그늘 ────────────────────────────
// ⚠️⚠️ **앞쪽에 «무대 앞막» 카드를 세워 보고 되돌렸다** — 이 카메라(화각 32° · 거리 11.6)
//    에서는 z=4.7 짜리 판이 시야 «밖»이라 한 프레임도 안 보였다. 깊이를 만드는 것은
//    앞에 뭘 세우는 것이 아니라 **벽 밑동이 어두워지는 것**이다 (사진의 그 자리다).
const cornerTex = tex(64, 256, (g, w, h) => {
  const lg = g.createLinearGradient(0, 0, 0, h);
  lg.addColorStop(0, 'rgba(26,14,26,0.44)');
  lg.addColorStop(0.55, 'rgba(26,14,26,0.16)');
  lg.addColorStop(1, 'rgba(26,14,26,0)');
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
});
const cornerMat = () => new THREE.MeshBasicMaterial({ map: cornerTex, transparent: true,
  depthWrite: false, side: THREE.DoubleSide });
const cBack = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W + 4, 1.9), cornerMat());
cBack.rotation.x = -Math.PI / 2;
cBack.position.set(0, 0.03, -ROOM_D / 2 + 0.95);
scene.add(cBack);
[-1, 1].forEach(s => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D + 4, 1.6), cornerMat());
  m.rotation.set(-Math.PI / 2, 0, s * Math.PI / 2);
  m.position.set(s * (ROOM_W / 2 - 0.8), 0.03, 0);
  scene.add(m);
});

// ══ 인물 — 지금 쓰는 아바타 SVG 그대로 ═════════════════════════
// ⚠️⚠️ **이것이 이 프로토타입의 요점이다.** 캐릭터를 3D 로 다시 만들면 옷 150벌 ·
//    표정 서른여덟 · 체형 다섯이 통째로 날아간다. 세트만 종이로 두고 인물은
//    빌보드로 세우면 **지금 그림이 한 픽셀도 안 바뀐 채로** 그 안에 선다.
// ⚠️⚠️ **빌보드는 «빛을 안 받는다»** (`MeshBasicMaterial`). 그것이 맞는 선택이다 —
//    SVG 에는 이미 음영이 그려져 있어서 빛을 한 번 더 먹이면 그림이 탁해지고,
//    판이 늘 카메라를 보므로 어차피 평면광이 된다. 그런데 그냥 두면 **밤이 되어도
//    인물만 대낮**이라 방에서 혼자 떠 보인다 — 그려 보고 알았다.
//    그래서 **칠에 색을 곱한다**(`material.color`): 낮 흰색 · 밤 달빛.
//    ⚠️ 새로 만드는 빌보드도 «지금 색»을 물고 나와야 한다 — 밤에 옷을 갈아입으면
//    그 판만 대낮으로 되돌아간다 (그래서 `TINT.now` 를 한 곳에서 읽는다)
const TINT = { now: 0xffffff, day: 0xffffff, night: 0xa3aed6 };
const FIG_H = 3.05;
const figMat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.35,
  side: THREE.DoubleSide, toneMapped: false });
const fig = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), figMat);
scene.add(fig);
const figSh = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.05),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
figSh.rotation.x = -Math.PI / 2; figSh.position.y = 0.045;
scene.add(figSh);

function saved(key) {
  try {
    const raw = localStorage.getItem('dieter_alchemist_save_v1');
    const st = raw ? JSON.parse(raw) : null;
    return st ? st[key] : null;
  } catch (e) { return null; }
}
const so = saved('outfit');
let outfit = so ? Object.assign({}, so, { colors: saved('outfitColors') || {} })
                : { hair: 'hair_long', dress: 'dress_princess', shoes: 'shoes_maryjane' };
let weight = 0.55, tuneK = 1;
const tuneOf = (k) => {
  const t = {}; (window.Avatar.TUNE_KEYS || []).forEach(n => { t[n] = k; }); return t;
};
// ⚠️ 판의 크기·자리는 **뷰박스와 bodyMetrics().floorY 를 읽어서** 맞춘다 —
//    숫자를 박으면 몸무게·바디파츠를 바꾸는 순간 인물이 바닥을 뚫거나 뜬다
let figToken = 0;
function redrawFigure() {
  const my = ++figToken;
  const svg = window.Avatar.build(outfit, weight, tuneOf(tuneK));
  const vb = (svg.match(/viewBox="([^"]+)"/) || [])[1];
  if (!vb) return fatal('아바타 SVG 에 viewBox 가 없다');
  const [vx, vy, vw, vh] = vb.split(/\s+/).map(Number);
  const floorY = window.Avatar.bodyMetrics(weight).floorY;
  const PX = 3;
  const img = new Image();
  img.onload = () => {
    if (my !== figToken) return;
    const c = document.createElement('canvas');
    c.width = Math.round(vw * PX); c.height = Math.round(vh * PX);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    if (figMat.map) figMat.map.dispose();
    figMat.map = t; figMat.needsUpdate = true;
    const scale = FIG_H / vh;
    fig.scale.set(vw * scale, vh * scale, 1);
    const below = (vy + vh - floorY) * scale;
    fig.position.set(0, vh * scale / 2 - below, 0.1);
    figSh.scale.set(Math.max(0.55, 0.9 + weight * 0.35), 1, 1);
  };
  img.onerror = () => fatal('아바타 SVG 래스터화 실패');
  img.src = 'data:image/svg+xml;charset=utf-8,'
    + encodeURIComponent(svg.replace('<svg ', '<svg width="' + (vw * PX) + '" height="' + (vh * PX) + '" '));
}
redrawFigure();

// ══ 크리처도 빌보드다 ═════════════════════════════════════════
// ⚠️ 어디에 서는지는 **move 가 정한다** (게임과 같은 규칙) —
//    물고기는 어항 · 날개가 있으면 공중 · 나머지는 땅
const CR_FOOT = 0.88, CR_BOWL = 0.96;
const bills = [];
function svgTex(svg, px) {
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = px;
      c.getContext('2d').drawImage(img, 0, 0, px, px);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
      ok(t);
    };
    img.onerror = () => no(new Error('크리처 SVG 래스터화 실패'));
    img.src = 'data:image/svg+xml;charset=utf-8,'
      + encodeURIComponent(svg.replace('<svg ', '<svg width="' + px + '" height="' + px + '" '));
  });
}
const billPlane = (t, w, h) => new THREE.Mesh(new THREE.PlaneGeometry(w, h),
  new THREE.MeshBasicMaterial({ map: t, color: TINT.now, transparent: true, alphaTest: 0.02,
    side: THREE.DoubleSide, toneMapped: false, depthWrite: false }));
const CREATURES = window.GameData.RECIPES
  .filter(r => r.result.kind === 'creature').map(r => r.result);
const pets = new THREE.Group();
scene.add(pets);

// ⚠️ **어항은 «같은 상자 안»에 겹쳐 세운다** (creature.js 의 그 규칙 그대로) —
//    유리통(뒤) → 물고기 → 테·반사(앞). 물고기만 그룹 «안»에서 헤엄친다
async function addPet(c, spot) {
  const g = new THREE.Group();
  g.position.set(spot.x, 0, spot.z);
  pets.add(g); bills.push(g);
  const S = spot.h;
  if (c.move === 'water') {
    const b = window.Creature.bowl();
    const [tb, tf, tc] = await Promise.all([
      svgTex(b.back, 256), svgTex(b.front, 256),
      svgTex(window.Creature.draw(c, { flat: true, noShadow: true }), 256),
    ]);
    const y = (spot.y || 0) + (CR_BOWL - 0.5) * S;
    const back = billPlane(tb, S, S), front = billPlane(tf, S, S);
    const fish = billPlane(tc, S * 0.48, S * 0.48);
    back.position.y = front.position.y = y;
    fish.position.set(0, y + S * 0.08, 0.012);
    front.position.z = 0.024;
    g.add(back, fish, front);
    g.userData.fish = fish; g.userData.S = S;
  } else {
    const t = await svgTex(window.Creature.draw(c, { flat: true, noShadow: true }), 256);
    const m = billPlane(t, S, S);
    const air = c.move === 'air';
    m.position.y = (spot.y || 0) + (CR_FOOT - 0.5) * S + (air ? S * 1.7 : 0);
    g.add(m);
    g.userData.air = air ? m : null;
    g.userData.base = m.position.y;
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(S * 0.9, S * 0.5),
      new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false,
        opacity: air ? 0.5 : 1 }));
    sh.rotation.x = -Math.PI / 2;
    sh.position.y = (spot.y || 0) + 0.04;
    g.add(sh);
    g.userData.shadow = sh;   // ⚠️ 그림자는 «빌보드가 아니다» — 그룹이 돈 만큼 되돌린다
  }
  return g;
}
const byMove = m => CREATURES.filter(c => c.move === m);
let petIdx = 0;
async function redrawPets() {
  // ⚠️ 바꿀 때 **옛 그룹을 통째로 버린다** — 안 지우면 같은 자리에 겹쳐 쌓인다
  pets.children.slice().forEach(g => {
    g.traverse(o => {
      if (o.material) {
        if (o.material.map && o.material.map !== shadowTex) o.material.map.dispose();
        o.material.dispose();
      }
    });
    pets.remove(g);
    const i = bills.indexOf(g); if (i >= 0) bills.splice(i, 1);
  });
  const G = byMove('ground'), A = byMove('air'), W = byMove('water');
  const pid = saved('petRoom');
  const sp = pid ? CREATURES.find(c => c.id === pid) : null;
  const ground = (petIdx === 0 && sp && sp.move === 'ground') ? sp : G[petIdx % G.length];
  await addPet(ground, { x: 1.55, z: 1.45, h: 0.95 });
  await addPet(A[petIdx % A.length], { x: 2.25, z: 2.25, h: 0.84 });
  await addPet(W[petIdx % W.length], { x: 1.78, z: -1.05, y: 1.06, h: 0.82 });
}
redrawPets();

// ══ 먼지 — 빛줄기 속에 떠다니는 것 ═════════════════════════════
// ⚠️ 이것 하나로 방의 «공기»가 생긴다. 없으면 정물 사진이다
const DUST = 90;
const dustGeo = new THREE.BufferGeometry();
const dpos = new Float32Array(DUST * 3), dphase = new Float32Array(DUST);
for (let i = 0; i < DUST; i++) {
  dpos[i * 3] = -1.2 + Math.random() * 5.4;
  dpos[i * 3 + 1] = 0.4 + Math.random() * 4.4;
  dpos[i * 3 + 2] = -3.2 + Math.random() * 4.8;
  dphase[i] = Math.random() * 6.28;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xfff0cf, size: 0.05, transparent: true, opacity: 0.5, depthWrite: false,
  blending: THREE.AdditiveBlending,
}));
scene.add(dust);

// 화면 위의 종이결 (CSS 한 겹)
(function paintGrain() {
  const cv = document.getElementById('grain');
  cv.width = 220; cv.height = 220;
  const g = cv.getContext('2d'), r = rnd(99);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = r() < 0.5 ? '#000' : '#fff';
    g.fillRect(r() * 220, r() * 220, 1, 1);
  }
})();

// ══ 조작 ══════════════════════════════════════════════════════
let yaw = 0, pitch = 0.17, dist = 11.6, spin = true, night = false, spread = 0, wantSpread = 0;
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY }; spin = false; setBtn(bSpin, false);
  canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  yaw = Math.max(-0.8, Math.min(0.8, yaw + (e.clientX - drag.x) * 0.006));
  pitch = Math.max(-0.02, Math.min(0.55, pitch + (e.clientY - drag.y) * 0.003));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { drag = null; canvas.classList.remove('drag'); });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist = Math.max(6.4, Math.min(16, dist + e.deltaY * 0.012));
}, { passive: false });

const $ = id => document.getElementById(id);
const setBtn = (b, on) => b.classList.toggle('on', on);
const bSpin = $('bSpin'), bNight = $('bNight'), bCloth = $('bCloth'), bPet = $('bPet'), bFlat = $('bFlat');
bSpin.onclick = () => { spin = !spin; setBtn(bSpin, spin); };
bFlat.onclick = () => { wantSpread = wantSpread ? 0 : 1; setBtn(bFlat, !!wantSpread); };
bNight.onclick = () => {
  night = !night;
  bNight.textContent = night ? '☀️ 낮' : '🌙 밤';
  setBtn(bNight, night);
  winMat.map = night ? WIN_NIGHT : WIN_DAY; winMat.needsUpdate = true;
  key.intensity = night ? 0.4 : 1.5;
  amb.intensity = night ? 0.42 : 1.05;
  amb.color.set(night ? 0x8494c8 : 0xffe6d2);
  moon.intensity = night ? 2.2 : 0;
  shaft.material.opacity = night ? 0.3 : 1;
  scene.background.set(night ? '#0e0b14' : '#1b1520');
  scene.fog.color.set(night ? '#161320' : '#241b26');
  tintBills();
};
// 빌보드(인물·크리처)에 낮/밤 색을 곱한다 — 만들어질 때도 한 번 더 지난다
function tintBills() {
  TINT.now = night ? TINT.night : TINT.day;
  figMat.color.set(TINT.now);
  // ⚠️ 양탄자·마법진도 «빛을 안 받는» 재질이라 같이 안 물들이면 밤에 혼자 대낮이다
  rug.material.color.set(TINT.now);
  bills.forEach(g => g.traverse(o => {
    if (o.material && o.material.map && o.material.map !== shadowTex) o.material.color.set(TINT.now);
  }));
}
const DRESS = ['dress_princess', 'dress_short', 'dress_onepiece', 'dress_none'];
const HAIR = ['hair_long', 'hair_bob', 'hair_twin', 'hair_ponytail', 'hair_wave', 'hair_bun'];
let ci = 0;
bCloth.onclick = () => {
  ci++;
  const d = DRESS[ci % DRESS.length];
  outfit = Object.assign({}, outfit, { hair: HAIR[ci % HAIR.length], dress: d });
  if (d === 'dress_none') { outfit.top = 'top_blouse'; outfit.bottom = 'skirt_long'; }
  redrawFigure();
};
bPet.onclick = () => { petIdx++; redrawPets().then(tintBills); };
$('w').oninput = (e) => { weight = e.target.value / 100; $('wv').textContent = weight.toFixed(2); redrawFigure(); };
$('t').oninput = (e) => { tuneK = e.target.value / 100; $('tv').textContent = e.target.value + '%'; redrawFigure(); };

// ══ 돌린다 ════════════════════════════════════════════════════
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const slow = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), frames = 0, fpsAt = last;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (spin && !slow) yaw = Math.sin(now / 6400) * 0.40;

  // 「펼쳐 보기」 — 카드를 앞뒤로 벌려 **종이 층**이라는 것을 보여 준다
  spread += (wantSpread - spread) * Math.min(1, dt * 4);
  cards.forEach((g, i) => {
    g.position.z = g.userData.z0 + spread * (1.6 + (i % 4) * 0.5);
    g.position.x = g.userData.x0 * (1 + spread * 0.18);
  });

  camera.position.set(
    Math.sin(yaw) * dist * Math.cos(pitch),
    1.85 + Math.sin(pitch) * dist,
    Math.cos(yaw) * dist * Math.cos(pitch));
  camera.lookAt(0, 1.6, -0.5);

  // 빌보드 — **세로축으로만 돈다.** 카메라를 통째로 따라 기울이면 인물이 «눕는다»
  const faceCam = (o) => {
    o.rotation.y = Math.atan2(camera.position.x - o.position.x, camera.position.z - o.position.z);
  };
  faceCam(fig);
  bills.forEach(g => {
    faceCam(g);
    if (g.userData.shadow) g.userData.shadow.rotation.z = -g.rotation.y;
  });

  if (!slow) {
    glyph.rotation.z += dt * 0.3;
    glyph.material.opacity = 0.58 + Math.sin(now / 1400) * 0.16;
    brewLight.intensity = 1.5 + Math.sin(now / 430) * 0.45;
    flames.forEach(({ card, pl, seed }) => {
      card.scale.y = 1 + Math.sin(now / 150 + seed) * 0.012;
      pl.intensity = 1.3 + Math.sin(now / 140 + seed) * 0.32;
    });
    const P = dustGeo.attributes.position;
    for (let i = 0; i < DUST; i++) {
      let y = P.getY(i) + dt * 0.12;
      if (y > 5.0) y = 0.3;
      P.setY(i, y);
      P.setX(i, dpos[i * 3] + Math.sin(now / 2600 + dphase[i]) * 0.22);
    }
    P.needsUpdate = true;
    bills.forEach((g, i) => {
      if (g.userData.air) g.userData.air.position.y = g.userData.base + Math.sin(now / 900 + i) * 0.1;
      const f = g.userData.fish;
      if (f) {
        const S = g.userData.S, t = (now / 6000) % 1;
        const k = t < 0.5 ? (t / 0.5) : (1 - (t - 0.5) / 0.5);
        f.position.x = (k - 0.5) * S * 0.16;
        f.scale.x = t < 0.5 ? 1 : -1;
      }
    });
  }
  renderer.render(scene, camera);

  frames++;
  if (now - fpsAt > 500) {
    $('fps').textContent = Math.round(frames * 1000 / (now - fpsAt)) + ' fps · '
      + renderer.info.render.triangles.toLocaleString() + ' tri';
    frames = 0; fpsAt = now;
  }
}
requestAnimationFrame(tick);

$('note').innerHTML = '세트는 <b>캔버스에 그린 종이 카드</b>(재단면 + 손으로 그은 잉크선), '
  + '인물·크리처는 <b>avatar.js · creature.js 의 SVG 그대로</b>입니다. 게임 본편은 한 줄도 안 바뀝니다.';
</script>
</body>
</html>
